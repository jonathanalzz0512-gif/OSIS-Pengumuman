<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman Seleksi OSIS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
      text-align: center;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 18px;
      background: #1261d6;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      color: #172033;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #697386;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .announcement {
      background: #eef5ff;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .announcement h2 {
      color: #1261d6;
      font-size: 18px;
      margin-bottom: 10px;
    }

    #countdown {
      font-size: 25px;
      font-weight: bold;
      color: #172033;
    }

    .login {
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9dee8;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1261d6;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      background: #1261d6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0d4fae;
    }

    .note {
      margin-top: 18px;
      color: #7a8394;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">OS</div>

    <h1>Pengumuman Seleksi OSIS</h1>

    <p class="subtitle">
      Sistem Informasi Hasil Seleksi Calon Pengurus OSIS
    </p>

    <div class="announcement">
      <h2>Pengumuman Seleksi</h2>
      <div id="countdown">Memuat...</div>
    </div>

    <div class="login">

      <label for="pesertaId">ID Peserta</label>
      <input
        type="text"
        id="pesertaId"
        placeholder="Masukkan ID peserta"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
      >

      <button onclick="login()">
        Lihat Hasil Seleksi
      </button>

    </div>

    <p class="note">
      Hasil seleksi hanya dapat dilihat setelah waktu pengumuman resmi.
    </p>

  </div>

  <script>
    // Waktu pengumuman sementara
    // 2026-09-28 12:00:00 UTC = 19:00 WIB
    const announcementTime =
      new Date("2026-09-28T12:00:00Z").getTime();

    function updateCountdown() {

      const now = new Date().getTime();
      const distance = announcementTime - now;

      if (distance <= 0) {
        document.getElementById("countdown").innerHTML =
          "PENGUMUMAN SUDAH DIBUKA";
        return;
      }

      const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60))
        / (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60))
        / 1000
      );

      document.getElementById("countdown").innerHTML =
        `${days} hari ${hours} jam ${minutes} menit ${seconds} detik`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    function login() {

      const id = document.getElementById("pesertaId").value;
      const password = document.getElementById("password").value;

      if (!id || !password) {
        alert("ID peserta dan password wajib diisi.");
        return;
      }

      alert(
        "Sistem login sedang disiapkan. " +
        "Database Supabase akan kita hubungkan pada tahap berikutnya."
      );
    }
  </script>

</body>
</html>
